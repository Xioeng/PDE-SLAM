[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pde-slam"
version = "0.1.0"
description = "Aquatic SLAM constrained by advection-diffusion PDE for water feature maps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "PDE-SLAM Contributors" }]
keywords = ["slam", "pde", "jax", "fluid-dynamics", "robotics", "marine"]

dependencies = [
    # --- JAX ecosystem (CPU by default) ---
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    # --- Differentiable ODE/PDE solvers ---
    "diffrax>=0.6.0",
    # --- Scientific stack ---
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    # --- Visualization ---
    "matplotlib>=3.9.0",
    # --- Optimization helpers ---
    "optax>=0.2.3",
    # --- Data handling (survey scripts) ---
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pde_slam"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
